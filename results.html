<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search results — Plight</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Plight</a>
    <p class="tagline">Innovation Search Engine</p>
  </header>

  <main class="main">
    <section class="search-bar-section">
      <form class="search-form" id="searchForm" role="search">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="e.g. solar energy, health monitoring, waste recycling"
          autocomplete="off"
          aria-label="Search innovation ideas"
        />
        <button type="submit" class="search-btn">Search</button>
      </form>
    </section>

    <section class="results-section" id="resultsSection">
      <h2 id="resultsHeading">Search results</h2>
      <div class="cards-grid" id="resultsGrid"></div>
      <p class="no-results hidden" id="noResults">No ideas match your search. Try different keywords.</p>
    </section>
  </main>

  <aside class="modal hidden" id="ideaModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button type="button" class="modal-close" id="modalClose" aria-label="Close">×</button>
      <h2 id="modalTitle" class="modal-title"></h2>
      <div class="modal-body">
        <div class="idea-overview">
          <h3>Overview</h3>
          <p id="modalOverview"></p>
          <p class="research-link" id="modalResearch"></p>
        </div>
        <div class="idea-steps">
          <h3>Steps</h3>
          <ol id="modalSteps"></ol>
        </div>
        <div class="idea-flowchart">
          <h3>Flowchart</h3>
          <div class="mermaid-wrap" id="modalFlowchart"></div>
        </div>
      </div>
    </div>
  </aside>

  <footer class="footer">
    <p>Plight — Innovation ideas linked with research papers</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
